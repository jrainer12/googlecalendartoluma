replicaCount: 1

image:
  repository: localhost/googlecalendartoluma  # Podman prefixes with localhost/
  pullPolicy: Never  # Use local image in minikube
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

config:
  gcalEmbedUrl: "https://calendar.google.com/calendar/embed?src=tnti8oguf84qd354budk86vdpk%40group.calendar.google.com&ctz=America%2FNew_York"
  lumaCalendarApiId: "cal-iPlAn4RA1wD1lDh"
  timezoneName: "America/New_York"
  limit: 5
  coverUrl: "https://images.lumacdn.com/gallery-images/vn/e95edc2d-7ad2-45a0-ba4c-393e17cb8f60"
  tintColor: "#708967"
  fontTitle: "geist-mono"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: false
  annotations: {}

podAnnotations: {}

autoscaling:
  enabled: true  # Set to true to enable HPA
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

ingress:
  enabled: false
  className: "nginx"  # or "traefik", "istio", etc.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: googlecalendartoluma.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: googlecalendartoluma-tls
  #    hosts:
  #      - googlecalendartoluma.local

