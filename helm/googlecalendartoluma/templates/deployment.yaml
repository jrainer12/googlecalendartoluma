apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "googlecalendartoluma.fullname" . }}
  labels:
    {{- include "googlecalendartoluma.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "googlecalendartoluma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "googlecalendartoluma.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.serviceAccount }}
      {{- if .create }}
      serviceAccountName: {{ include "googlecalendartoluma.fullname" $ }}
      {{- end }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: GCAL_EMBED_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: GCAL_EMBED_URL
        - name: LUMA_CALENDAR_API_ID
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: LUMA_CALENDAR_API_ID
        - name: TIMEZONE_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: TIMEZONE_NAME
        - name: LIMIT
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: LIMIT
        - name: COVER_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: COVER_URL
        - name: TINT_COLOR
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: TINT_COLOR
        - name: FONT_TITLE
          valueFrom:
            configMapKeyRef:
              name: {{ include "googlecalendartoluma.fullname" . }}-config
              key: FONT_TITLE
        - name: OUT_DIR
          value: "/app/luma_payloads"
        - name: PORT
          value: "5000"
        - name: HOST
          value: "0.0.0.0"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

