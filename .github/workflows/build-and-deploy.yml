name: Build and Deploy All Environments

permissions:
  contents: read
  packages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Comma-separated list of modules to build (e.g., "api,cronjob")'
        required: true
        default: 'api,cronjob'
      environments:
        description: 'Comma-separated list of environments to deploy (e.g., "prod,staging")'
        required: true
        default: 'prod'
      releaseBuild:
        description: 'Deploy As Release Build'
        required: false
        default: 'false'
        type: boolean
      runUnitTests:
        description: 'Run Unit Tests During Docker Build'
        required: true
        default: false
        type: boolean

env:
  # Hardcoded registry + namespace (for GHCR)
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # K8s namespace where everything runs
  K8S_NAMESPACE: rainercloud

jobs:
  Prepare_Data:
    name: Prepare Matrix Json
    runs-on: ubuntu-latest
    outputs:
      modules_json: ${{ steps.prepare.outputs.modules_json }}
      matrix_json: ${{ steps.prepare.outputs.matrix_json }}
    steps:
      - name: Prepare matrix JSON
        id: prepare
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/prepare-matrix-json@main
        with:
          modules: ${{ github.event.inputs.modules }}
          environments: ${{ github.event.inputs.environments }}
          release_name: googlecalendartoluma-api

  Docker_Build:
    name: Docker Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: Prepare_Data
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.modules_json) }}
    env:
      IMAGE_NAME: ${{ matrix.module }}
      IMAGE_NAME_LOWER: ${{ matrix.module_lower }}
      IMAGE_TAG: ${{ github.run_id }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/${{ matrix.module_lower }}:${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.IMAGE_NAME }}
          file: ./${{ env.IMAGE_NAME }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FULL }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUN_UNIT_TESTS=${{ github.event.inputs.runUnitTests }}

      - name: Extract test artifacts (if unit tests run)
        if: github.event.inputs.runUnitTests == 'true'
        run: |
          docker create --name test-container ${{ env.IMAGE_FULL }}
          docker cp test-container:/app/test-results ./test-results || true
          docker cp test-container:/app/coverage.xml ./coverage.xml || true
          docker rm test-container
        continue-on-error: true

      - name: Upload test results
        if: github.event.inputs.runUnitTests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.IMAGE_NAME_LOWER }}
          path: |
            test-results/
            coverage.xml
          if-no-files-found: ignore

  Deploy_To_Kubernetes:
    name: Deploy ${{ matrix.module }} to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [Prepare_Data, Docker_Build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.matrix_json) }}

    # GitHub Environment = matrix.environment (prod, staging, etc.)
    environment:
      name: ${{ matrix.environment }}

    env:
      IMAGE_REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/${{ matrix.module_lower }}:${{ github.run_id }}
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
      K8S_NAMESPACE: rainercloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup Kubernetes context
        run: |
          # Setup kubectl config from environment secret (plain or base64)
          echo "${{ env.KUBECONFIG_DATA }}" | base64 -d > kubeconfig.yaml 2>/dev/null || echo "${{ env.KUBECONFIG_DATA }}" > kubeconfig.yaml
      
          chmod 600 kubeconfig.yaml
      
          export KUBECONFIG=$(pwd)/kubeconfig.yaml
      
          # Force-select a real context
          CTX=$(kubectl config get-contexts -o name | head -n 1)
          if [ -z "$CTX" ]; then
            echo "❌ No contexts found in kubeconfig"
            kubectl config get-contexts || true
            exit 1
          fi
      
          echo "Using Kubernetes context: $CTX"
          kubectl config use-context "$CTX"
      
          # Sanity check
          kubectl cluster-info || echo "Warning: Could not connect to cluster - verify KUBECONFIG secret"

      - name: Install Helm
        if: matrix.module == 'api'
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      # Deploy API module with Helm
      - name: Deploy API with Helm
        if: matrix.module == 'api'
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig.yaml
          
          CHART_PATH="./api/helm/googlecalendartoluma"
          RELEASE_NAME="${{ matrix.releaseName }}"
          ENVIRONMENT="${{ matrix.environment }}"
          NAMESPACE="${{ env.K8S_NAMESPACE }}"
          
          if [ ! -d "$CHART_PATH" ]; then
            echo "Error: Chart path $CHART_PATH not found"
            exit 1
          fi
          
          if [ -f "$CHART_PATH/values-$ENVIRONMENT.yaml" ]; then
            VALUES_FILE="$CHART_PATH/values-$ENVIRONMENT.yaml"
          else
            VALUES_FILE="$CHART_PATH/values.yaml"
          fi
          
          IMAGE_REPO="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.module_lower }}"
          IMAGE_TAG="${{ github.run_id }}"
          
          echo "Deploying $RELEASE_NAME to environment: $ENVIRONMENT (namespace: $NAMESPACE)"
          echo "Chart: $CHART_PATH"
          echo "Values: $VALUES_FILE"
          echo "Image: $IMAGE_REPO:$IMAGE_TAG"
          
          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="$IMAGE_TAG" \
            --set image.pullPolicy=Always \
            --set env.name="$ENVIRONMENT" \
            -f "$VALUES_FILE" \
            --wait --timeout 300s
          
          kubectl get deployment "$RELEASE_NAME" -n "$NAMESPACE" || echo "Warning: Deployment not found"
          kubectl get svc "$RELEASE_NAME" -n "$NAMESPACE" || echo "Warning: Service not found"

      # Deploy CronJob module with kubectl
      - name: Deploy CronJob with kubectl
        if: matrix.module == 'cronjob'
        run: |
          export KUBECONFIG=$(pwd)/kubeconfig.yaml
          
          ENVIRONMENT="${{ matrix.environment }}"
          NAMESPACE="${{ env.K8S_NAMESPACE }}"
          
          if [ ! -f "./cronjob/deployment/cronjob.yaml" ]; then
            echo "Error: CronJob manifest not found"
            exit 1
          fi
          
          if [ ! -f "./cronjob/deployment/configmap.yaml" ]; then
            echo "Error: ConfigMap manifest not found"
            exit 1
          fi
          
          cp ./cronjob/deployment/cronjob.yaml ./cronjob-deployment-temp.yaml
          
          sed -i "s|image:.*|image: ${{ env.IMAGE_FULL }}|g" ./cronjob-deployment-temp.yaml
          sed -i "s|imagePullPolicy:.*|imagePullPolicy: Always|g" ./cronjob-deployment-temp.yaml
          
          echo "Deploying CronJob to environment: $ENVIRONMENT (namespace: $NAMESPACE)"
          echo "Image: ${{ env.IMAGE_FULL }}"
          
          kubectl apply -n "$NAMESPACE" -f ./cronjob/deployment/configmap.yaml
          kubectl apply -n "$NAMESPACE" -f ./cronjob-deployment-temp.yaml
          
          kubectl get cronjob "${{ matrix.releaseName }}" -n "$NAMESPACE" || echo "Warning: CronJob not found"
          
          rm -f ./cronjob-deployment-temp.yaml

  Summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [Prepare_Data, Docker_Build, Deploy_To_Kubernetes]
    if: always()
    steps:
      - name: Print deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Modules Built:** ${{ github.event.inputs.modules }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environments Deployed:** ${{ github.event.inputs.environments }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Registry:** ${{ env.IMAGE_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Namespace:** ${{ env.IMAGE_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID (Image Tag):** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cronjob:${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY