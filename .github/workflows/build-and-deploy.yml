name: Build and Deploy All Environments

permissions:
  contents: read
  packages: write
  id-token: write
  checks: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'Comma-separated list of modules to build (e.g., "api,cronjob")'
        required: true
        default: 'api,cronjob'
      environments:
        description: 'Comma-separated list of environments to deploy (e.g., "prod,staging")'
        required: true
        default: 'prod'
      releaseBuild:
        description: 'Deploy As Release Build'
        required: false
        default: 'false'
        type: boolean
      runUnitTests:
        description: 'Run Unit Tests During Docker Build'
        required: true
        default: false
        type: boolean

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  K8S_NAMESPACE: rainercloud

jobs:
  Prepare_Data:
    name: Prepare Matrix Json
    runs-on: ubuntu-latest
    outputs:
      modules_json: ${{ steps.prepare.outputs.modules_json }}
      matrix_json: ${{ steps.prepare.outputs.matrix_json }}
    steps:
      - name: Prepare matrix JSON
        id: prepare
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/prepare-matrix-json@main
        with:
          modules: ${{ github.event.inputs.modules }}
          environments: ${{ github.event.inputs.environments }}
          # Per-module Helm release names for workloads module_name:whatever you want release name to be
          release_overrides: |
            api:googlecalendartoluma-api

  Test:
    name: Run Unit Tests ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: Prepare_Data
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.modules_json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python Tests
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/run-python-pytests@main
        with:
          module_path: ${{ matrix.module }}
          python_version: '3.13'
          check_name: Unit Test Results (${{ matrix.module }})
          codecov_flags: ${{ matrix.module }}
          codecov_name: codecov-${{ matrix.module }}

  Docker_Build:
    name: Docker Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: Prepare_Data
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.modules_json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push Docker image (multi-arch)
        id: build
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/docker-build-multiarch@main
        with:
          module: ${{ matrix.module }}
          image_registry: ${{ env.IMAGE_REGISTRY }}
          image_namespace: ${{ env.IMAGE_NAMESPACE }}
          image_tag: ${{ github.run_id }}
          docker_context: ./${{ matrix.module }}
          dockerfile: ./${{ matrix.module }}/Dockerfile
          run_unit_tests: ${{ github.event.inputs.runUnitTests }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image_full }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1          # fail only on HIGH/CRITICAL
          ignore-unfixed: true

  Deploy_To_Kubernetes:
    name: Deploy ${{ matrix.module }} to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [Prepare_Data, Docker_Build, Test]
    if: needs.Test.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.matrix_json) }}

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Helm Chart repository
        if: matrix.module == 'api'
        uses: actions/checkout@v4
        with:
          repository: jrainer12/Reusable_Helm_Chart
          path: helm-chart

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Setup Kubernetes context
        id: kube
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/setup-kube-context@main
        with:
          kubeconfig_data: ${{ secrets.KUBECONFIG }}
          # context_name: my-context

      # Copy environment-specific values file to helm chart directory
      - name: Prepare values files for Helm
        if: matrix.module == 'api'
        run: |
          # Copy base values file
          cp ./api/values/values.yaml ./helm-chart/values.yaml
          # Copy environment-specific values file if it exists
          if [[ -f "./api/values/values-${{ matrix.environment }}.yaml" ]]; then
            cp "./api/values/values-${{ matrix.environment }}.yaml" "./helm-chart/values-${{ matrix.environment }}.yaml"
          fi

      # Deploy API module with Helm (using releaseName from matrix)
      - name: Deploy API with Helm
        if: matrix.module == 'api'
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/deploy-helm-release@main
        with:
          chart_path: ./helm-chart
          release_name: ${{ matrix.releaseName }}
          namespace: ${{ env.K8S_NAMESPACE }}
          environment: ${{ matrix.environment }}
          image_repository: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.module_lower }}
          image_tag: ${{ github.run_id }}
          values_file_base: values.yaml

      # Deploy CronJob module with kubectl + YAML
      - name: Deploy CronJob with manifest
        if: matrix.module == 'cronjob'
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/deploy-cronjob-manifest@main
        with:
          namespace: ${{ env.K8S_NAMESPACE }}
          environment: ${{ matrix.environment }}
          cronjob_manifest: ./cronjob/deployment/cronjob.yaml
          configmap_manifest: ./cronjob/deployment/configmap.yaml
          image_full: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.module_lower }}:${{ github.run_id }}

  Summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [Test, Prepare_Data, Docker_Build, Deploy_To_Kubernetes]
    if: always()
    steps:
      - name: Print deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Modules Built:** ${{ github.event.inputs.modules }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environments Deployed:** ${{ github.event.inputs.environments }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Registry:** ${{ env.IMAGE_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Namespace:** ${{ env.IMAGE_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID (Image Tag):** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cronjob:${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
