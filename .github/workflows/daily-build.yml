name: Daily Build

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Comma-separated list of modules to build (e.g., "api,cronjob")'
        required: true
        default: 'api,cronjob'
      imageTag:
        description: 'Custom image tag (default: latest)'
        required: false
        default: 'latest'

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  Prepare_Data:
    name: Prepare Matrix Json
    runs-on: ubuntu-latest
    outputs:
      modules_json: ${{ steps.construct-modules-only-matrix.outputs.modules_json }}
    steps:
      - id: construct-modules-only-matrix
        run: |
          # Use input modules if workflow_dispatch, otherwise default to both
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MODULES_INPUT="${{ github.event.inputs.modules }}"
          else
            MODULES_INPUT="api,cronjob"
          fi
          
          MODULES_JSON='{"include":['
          IFS=',' read -ra MODULES <<< "$MODULES_INPUT"
          for module in "${MODULES[@]}"; do
            MODULES_JSON+='{"module":"'"$module"'","module_lower":"'"$(echo $module | tr '[:upper:]' '[:lower:]')"'"},'
          done
          MODULES_JSON=${MODULES_JSON%,}
          MODULES_JSON+=']}'
          echo "Modules JSON: $MODULES_JSON"
          echo "modules_json=$MODULES_JSON" >> $GITHUB_OUTPUT

  Docker_Build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: Prepare_Data
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.modules_json) }}
    env:
      IMAGE_NAME: ${{ matrix.module }}
      IMAGE_NAME_LOWER: ${{ matrix.module_lower }}
      IMAGE_FULL: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.module_lower }}:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.imageTag != '' && github.event.inputs.imageTag || 'latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ env.IMAGE_NAME }}
          file: ./${{ env.IMAGE_NAME }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_FULL }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME_LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Digest
        run: echo "Image pushed: ${{ env.IMAGE_FULL }}"

  Summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [Prepare_Data, Docker_Build]
    if: always()
    steps:
      - name: Print build summary
        run: |
          # Determine image tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.imageTag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.imageTag }}"
          else
            IMAGE_TAG="latest"
          fi
          
          echo "## Daily Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Modules Built:** ${{ needs.Prepare_Data.outputs.modules_json }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Registry:** ${{ env.IMAGE_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** $IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built and Pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cronjob:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images are available at:" >> $GITHUB_STEP_SUMMARY
          echo "- https://ghcr.io/${{ env.IMAGE_NAMESPACE }}/api" >> $GITHUB_STEP_SUMMARY
          echo "- https://ghcr.io/${{ env.IMAGE_NAMESPACE }}/cronjob" >> $GITHUB_STEP_SUMMARY

