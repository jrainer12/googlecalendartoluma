name: Daily Build

permissions:
  contents: read
  packages: write

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Custom image tag (default: latest)'
        required: false
        default: 'latest'

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  MODULES: api,cronjob
  DEFAULT_IMAGE_TAG: latest

jobs:
  Prepare_Data:
    name: Prepare Matrix Json
    runs-on: ubuntu-latest
    outputs:
      modules_json: ${{ steps.prepare.outputs.modules_json }}
    steps:
      - name: Prepare matrix JSON
        id: prepare
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/prepare-matrix-json@main
        with:
          # Always build the hardcoded modules for this pipeline
          modules: ${{ env.MODULES }}
          # Dummy environment just to satisfy the action input
          environments: daily
          release_overrides: ""

  Docker_Build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: Prepare_Data
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Prepare_Data.outputs.modules_json) }}
    env:
      # Resolve image tag from env + optional input
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.imageTag || env.DEFAULT_IMAGE_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & push Docker image (multi-arch)
        id: build
        uses: jrainer12/Reusable_GitHub_Actions/.github/actions/docker-build-multiarch@main
        with:
          module: ${{ matrix.module }}
          image_registry: ${{ env.IMAGE_REGISTRY }}
          image_namespace: ${{ env.IMAGE_NAMESPACE }}
          image_tag: ${{ env.IMAGE_TAG }}
          docker_context: ./${{ matrix.module }}
          dockerfile: ./${{ matrix.module }}/Dockerfile
          run_unit_tests: "false"
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image_full }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Image Digest
        run: |
          echo "Image pushed: ${{ steps.build.outputs.image_full }}"

  Summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [Prepare_Data, Docker_Build]
    if: always()
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.imageTag || env.DEFAULT_IMAGE_TAG }}
    steps:
      - name: Print build summary
        run: |
          echo "## Daily Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Modules:** ${{ env.MODULES }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Registry:** ${{ env.IMAGE_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Namespace:** ${{ env.IMAGE_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** $IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built and Pushed (by convention):" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cronjob:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images are available at:" >> $GITHUB_STEP_SUMMARY
          echo "- https://ghcr.io/${{ env.IMAGE_NAMESPACE }}/api" >> $GITHUB_STEP_SUMMARY
          echo "- https://ghcr.io/${{ env.IMAGE_NAMESPACE }}/cronjob" >> $GITHUB_STEP_SUMMARY
