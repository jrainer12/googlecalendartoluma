{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "app.fullname" $ }}
                port:
                  {{- if .portName }}
                    {{- /* Use portName to reference service port by name */}}
                    {{- $portName := .portName }}
                    {{- if $.Values.service.ports }}
                      {{- $foundPort := false }}
                      {{- range $.Values.service.ports }}
                        {{- if eq .name $portName }}
                  name: {{ $portName }}
                          {{- $foundPort = true }}
                        {{- end }}
                      {{- end }}
                      {{- if not $foundPort }}
                        {{- fail (printf "Port name '%s' not found in service.ports" $portName) }}
                      {{- end }}
                    {{- else }}
                      {{- /* Fallback to default http port if using single port config */}}
                  number: {{ $.Values.service.port }}
                    {{- end }}
                  {{- else if .portNumber }}
                    {{- /* Use explicit port number */}}
                  number: {{ .portNumber }}
                  {{- else }}
                    {{- /* Default: use service.port for backward compatibility */}}
                  number: {{ $.Values.service.port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}

