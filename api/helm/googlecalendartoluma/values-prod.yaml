# Production environment overrides
# Used by GitHub Actions when environment=prod

fullnameOverride: ""

# Allow Kubernetes to pull from GHCR
imagePullSecrets:
  - name: ghcr-login

config:
  # Show more events in prod than dev
  limit: 5

# Environment variables for production
# These can reference secrets or ConfigMaps
env:
  DEPLOYMENT_PROFILE: "prod"
  # Example Spring Cloud Config (uncomment and configure as needed):
  # SPRING_TENANT:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: TENANT
  # SPRING_CLIENT_ID:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: CLIENT_ID
  # SPRING_CLIENT_SECRET:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: CLIENT_SECRET
  # SPRING_SCOPE:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: SCOPE

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

gateway:
  enabled: true
  namespace: ""  # Leave empty to use release namespace
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare

  parentRefs:
    - name: public-gateway-nginx        # shared Gateway name
      namespace: nginx-gateway

  hostnames:
    - rainercloud.com

  # External path to match on the Gateway.
  # Your app will usually see this rewritten to "/" via a URLRewrite filter.
  pathPrefix: "/backend/luma-syncer"

  # When you want multiple backends (e.g. HTTP + WebSocket on same pod),
  # add additional entries here.
  backends:
    - name: luma-syncer            # Service name (defaults to app.fullname if omitted in template)
      port: 5000                   # HTTP REST port
      weight: 100

  # Fallback if backends is not set (single backend)
  backendPort: 5000

  # Gateway API filters reference:
  # https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#httproute-filters
  #
  # Examples you can uncomment and customize:
  #
  # filters:
  #   # 1) Strip the external prefix so the app sees "/" instead of "/backend/luma-syncer"
  #   - type: URLRewrite
  #     urlRewrite:
  #       path:
  #         type: ReplacePrefixMatch
  #         replacePrefixMatch: /
  #
  #   # 2) Add custom request headers
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       add:
  #         X-Env: "dev"
  #         X-App: "luma-syncer"
  #
  #   # 3) NGINX Gateway Fabric extension (example CORS policy)
  #   # - type: ExtensionRef
  #   #   extensionRef:
  #   #     group: gateway.nginx.org
  #   #     kind: CORS
  #   #     name: luma-syncer-cors
  #
  filters: []


