# Production environment overrides
# Used by GitHub Actions when environment=prod

fullnameOverride: ""

# Allow Kubernetes to pull from GHCR
imagePullSecrets:
  - name: ghcr-login

config:
  # Show more events in prod than dev
  limit: 5

# Environment variables for production
# These can reference secrets or ConfigMaps
env:
  DEPLOYMENT_PROFILE: "prod"
  # Example Spring Cloud Config (uncomment and configure as needed):
  # SPRING_TENANT:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: TENANT
  # SPRING_CLIENT_ID:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: CLIENT_ID
  # SPRING_CLIENT_SECRET:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: CLIENT_SECRET
  # SPRING_SCOPE:
  #   valueFrom:
  #     secretKeyRef:
  #       name: spring-cloud-config
  #       key: SCOPE

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: ""
      paths:
        - path: /backend/luma-syncer
          pathType: Prefix
          portName: http
  tls: []