replicaCount: 1

image:
  repository: localhost/my-api
  pullPolicy: Never
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  ports:
   - name: http
     port: 80
     targetPort: 5000
     protocol: TCP

# Generic config map - add any key-value pairs here
# They will be converted to environment variables in the ConfigMap
config:
  gcalEmbedUrl: "https://calendar.google.com/calendar/embed?src=tnti8oguf84qd354budk86vdpk%40group.calendar.google.com&ctz=America%2FNew_York"
  lumaCalendarApiId: "cal-iPlAn4RA1wD1lDh"
  timezoneName: "America/New_York"
  limit: 5
  coverUrl: "https://images.lumacdn.com/gallery-images/vn/e95edc2d-7ad2-45a0-ba4c-393e17cb8f60"
  tintColor: "#708967"
  fontTitle: "geist-mono"

env: {}

envVars: {}

# Host binding for the application
host: "0.0.0.0"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: false
  annotations: {}

podAnnotations: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

ingress:
  enabled: false

gateway:
  enabled: false
  namespace: ""  # Leave empty to use release namespace
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare

  parentRefs:
    - name: public-gateway-nginx         # shared Gateway name
      namespace: nginx-gateway

  hostnames:
    - rainercloud.com

  # External path to match on the Gateway.
  # Your app will usually see this rewritten to "/" via a URLRewrite filter.
  pathPrefix: "/"

  # When you want multiple backends (e.g. HTTP + WebSocket on same pod),
  # add additional entries here.
  backends:
    - name: luma-syncer            # Service name (defaults to app.fullname if omitted in template)
      port: 5000                   # HTTP REST port
      weight: 100

  # Fallback if backends is not set (single backend)
  backendPort: 5000

  # Gateway API filters reference:
  # https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#httproute-filters
  #
  # Examples you can uncomment and customize:
  #
  # filters:
  #   # 1) Strip the external prefix so the app sees "/" instead of "/backend/luma-syncer"
  #   - type: URLRewrite
  #     urlRewrite:
  #       path:
  #         type: ReplacePrefixMatch
  #         replacePrefixMatch: /
  #
  #   # 2) Add custom request headers
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       add:
  #         X-Env: "dev"
  #         X-App: "luma-syncer"
  #
  #   # 3) NGINX Gateway Fabric extension (example CORS policy)
  #   # - type: ExtensionRef
  #   #   extensionRef:
  #   #     group: gateway.nginx.org
  #   #     kind: CORS
  #   #     name: luma-syncer-cors
  #
  filters: []

